# Builds the phone app and the Wear OS app together (debug builds) and uploads both APKs.
# One job = one auto-generated debug key, so the phone and watch apps share a signature,
# which the Wear Data Layer needs to link them. Same action versions as the repo's own android.yml.
name: Watch build

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Phone and watch debug APKs
        run: ./gradlew :app:assembleDebug :wear:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: orpheon-phone-debug
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: orpheon-watch-debug
          path: base/wear/build/outputs/apk/debug/*.apk
          retention-days: 14
